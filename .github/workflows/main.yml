name: Multi Environment Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build WAR
        run: mvn clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/java-my-webapp.war

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to Development
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.DEV_TOMCAT_USERNAME }}:${{ secrets.DEV_TOMCAT_PASSWORD }}" \
            --upload-file java-my-webapp.war \
            "${{ secrets.DEV_TOMCAT_URL }}/manager/text/deploy?path=/java-my-webapp&update=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK"

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: TEST
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to Testing
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.TEST_TOMCAT_USERNAME }}:${{ secrets.TEST_TOMCAT_PASSWORD }}" \
            --upload-file java-my-webapp.war \
            "${{ secrets.TEST_TOMCAT_URL }}/manager/text/deploy?path=/java-my-webapp&update=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK"

  deploy-preprod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: PREPROD
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to Pre-production
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.PREPROD_TOMCAT_USERNAME }}:${{ secrets.PREPROD_TOMCAT_PASSWORD }}" \
            --upload-file java-my-webapp.war \
            "${{ secrets.PREPROD_TOMCAT_URL }}/manager/text/deploy?path=/java-my-webapp&update=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK"

  deploy-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to Production
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.PROD_TOMCAT_USERNAME }}:${{ secrets.PROD_TOMCAT_PASSWORD }}" \
            --upload-file java-my-webapp.war \
            "${{ secrets.PROD_TOMCAT_URL }}/manager/text/deploy?path=/java-my-webapp&update=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK"
